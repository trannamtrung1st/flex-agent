openapi: 3.1.0
info:
  title: Flex Agent representative transport projection
  version: 0.2.0
  description: >
    Deterministic OpenAPI projection of representative command, event, manifest,
    evidence locator, audit, safe error, and SSE shapes. Structural fields mirror
    the canonical JSON Schema catalog; this projection is not authorization evidence
    and excludes internal-only fields by design.
paths:
  /v1/assessment/activities/{activityId}/cohorts/{cohortId}/enrollments:
    post:
      operationId: assignEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentAssignCommandV1'
      responses:
        '200':
          description: Enrollment assigned or exact same-Cohort retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentMutationOutcomeV1'
        '409':
          description: Safe conflict response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafeErrorResponseV1'
  /v1/assessment/my-work:
    get:
      operationId: listMyWork
      responses:
        '200':
          description: Current Participant Assignments
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schema_version, items, has_more]
                properties:
                  schema_version:
                    type: string
                    const: v1
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyWorkAssignmentV1'
                  next_cursor:
                    type: [string, 'null']
                  has_more:
                    type: boolean
  /session/commands:
    post:
      operationId: submitSessionCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCommandEnvelopeV1'
      responses:
        '200':
          description: Command accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStateEventEnvelopeV1'
        '409':
          description: Safe conflict response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafeErrorResponseV1'
  /session/events:
    get:
      operationId: streamSessionEvents
      responses:
        '200':
          description: SSE committed session events
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SseSessionEventV1'
components:
  schemas:
    EnrollmentAssignCommandV1:
      type: object
      additionalProperties: false
      required: [schema_version, participant_actor_id, idempotency_key]
      properties:
        schema_version:
          type: string
          const: v1
        participant_actor_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
    EnrollmentLifecycleCommandV1:
      type: object
      additionalProperties: false
      required: [schema_version, reason_code, expected_revision, idempotency_key]
      properties:
        schema_version:
          type: string
          const: v1
        reason_code:
          type: string
          enum:
            - temporary_restriction
            - restriction_removed
            - activity_or_enrollment_end
            - access_revoked
        expected_revision:
          type: integer
          minimum: 1
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
    EnrollmentMutationOutcomeV1:
      type: object
      additionalProperties: false
      required: [schema_version, succeeded, outcome_code, permitted_actions]
      properties:
        schema_version:
          type: string
          const: v1
        succeeded:
          type: boolean
        outcome_code:
          type: string
        enrollment_id:
          type: [string, 'null']
          format: uuid
        status:
          type: [string, 'null']
        revision:
          type: [integer, 'null']
        visibility:
          type: [string, 'null']
        permitted_actions:
          type: array
          items:
            type: string
    MyWorkAssignmentV1:
      type: object
      additionalProperties: false
      required: [enrollment_id, status, visibility, summary_available, permitted_actions]
      properties:
        enrollment_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, suspended]
        visibility:
          type: string
          enum: [current, restricted]
        activity_title:
          type: [string, 'null']
        task_title:
          type: [string, 'null']
        time_zone_id:
          type: [string, 'null']
        starts_at_utc:
          type: [string, 'null']
        ends_at_utc:
          type: [string, 'null']
        deadline_utc:
          type: [string, 'null']
        summary_available:
          type: boolean
        permitted_actions:
          type: array
          items:
            type: string
            enum: [open_assignment, return_to_my_work]
    Int64WireStringNineteenDigit:
      type: string
      minLength: 19
      maxLength: 19
      pattern: '^(922337203685477580[0-7]|92233720368547758[0-6][0-9]|9223372036854775[0-7][0-9]{2}|922337203685477[0-4][0-9]{3}|92233720368547[0-5][0-9]{4}|9223372036854[0-6][0-9]{5}|922337203685[0-3][0-9]{6}|92233720368[0-4][0-9]{7}|9223372036[0-7][0-9]{8}|922337203[0-5][0-9]{9}|92233720[0-2][0-9]{10}|9223372[0-0][0-9]{11}|922337[0-1][0-9]{12}|92233[0-6][0-9]{13}|9223[0-2][0-9]{14}|922[0-2][0-9]{15}|92[0-1][0-9]{16}|9[0-1][0-9]{17}|[1-8][0-9]{18})$'
    PositiveInt64WireString:
      oneOf:
        - type: string
          pattern: '^[1-9]$'
        - type: string
          pattern: '^[1-9][0-9]{1,16}$'
          minLength: 2
          maxLength: 17
        - type: string
          pattern: '^[1-9][0-9]{17}$'
          minLength: 18
          maxLength: 18
        - $ref: '#/components/schemas/Int64WireStringNineteenDigit'
    NonnegativeInt64WireString:
      oneOf:
        - const: '0'
        - type: string
          pattern: '^[1-9]$'
        - type: string
          pattern: '^[1-9][0-9]{1,16}$'
          minLength: 2
          maxLength: 17
        - type: string
          pattern: '^[1-9][0-9]{17}$'
          minLength: 18
          maxLength: 18
        - $ref: '#/components/schemas/Int64WireStringNineteenDigit'
    UtcTimestamp:
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
      maxLength: 32
    StableId:
      type: string
      minLength: 8
      maxLength: 128
      pattern: '^[a-z][a-z0-9._-]{7,127}$'
    SessionCommandEnvelopeV1:
      oneOf:
        - $ref: '#/components/schemas/SessionMessageSendCommandV1'
        - $ref: '#/components/schemas/SessionPauseCommandV1'
        - $ref: '#/components/schemas/SessionResumeCommandV1'
        - $ref: '#/components/schemas/SessionCompleteCommandV1'
        - $ref: '#/components/schemas/SessionTerminateCommandV1'
        - $ref: '#/components/schemas/SessionReconcileCommandV1'
    SessionCommandEnvelopeCoreV1:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - command_type
        - command_id
        - idempotency_key
        - session_locator
        - expected_session_version
        - payload
      properties:
        schema_version:
          type: string
          const: v1
        command_type:
          type: string
        command_id:
          $ref: '#/components/schemas/StableId'
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 128
        session_locator:
          type: object
          additionalProperties: false
          required: [session_id]
          properties:
            session_id:
              $ref: '#/components/schemas/StableId'
        expected_session_version:
          type: integer
          minimum: 0
          maximum: 2147483647
        client_last_seen_sequence:
          $ref: '#/components/schemas/PositiveInt64WireString'
        payload:
          type: object
    SessionMessageSendCommandV1:
      allOf:
        - $ref: '#/components/schemas/SessionCommandEnvelopeCoreV1'
        - type: object
          properties:
            command_type:
              const: session.message.send.v1
            payload:
              type: object
              additionalProperties: false
              required: [message_text]
              properties:
                message_text:
                  type: string
                  minLength: 1
                  maxLength: 16384
    SessionPauseCommandV1:
      allOf:
        - $ref: '#/components/schemas/SessionCommandEnvelopeCoreV1'
        - type: object
          properties:
            command_type:
              const: session.pause.v1
            payload:
              type: object
              additionalProperties: false
              maxProperties: 0
    SessionResumeCommandV1:
      allOf:
        - $ref: '#/components/schemas/SessionCommandEnvelopeCoreV1'
        - type: object
          properties:
            command_type:
              const: session.resume.v1
            payload:
              type: object
              additionalProperties: false
              maxProperties: 0
    SessionCompleteCommandV1:
      allOf:
        - $ref: '#/components/schemas/SessionCommandEnvelopeCoreV1'
        - type: object
          properties:
            command_type:
              const: session.complete.v1
            payload:
              type: object
              additionalProperties: false
              maxProperties: 0
    SessionTerminateCommandV1:
      allOf:
        - $ref: '#/components/schemas/SessionCommandEnvelopeCoreV1'
        - type: object
          properties:
            command_type:
              const: session.terminate.v1
            payload:
              type: object
              additionalProperties: false
              required: [reason_code]
              properties:
                reason_code:
                  type: string
                  minLength: 1
                  maxLength: 64
    SessionReconcileCommandV1:
      allOf:
        - $ref: '#/components/schemas/SessionCommandEnvelopeCoreV1'
        - type: object
          required: [client_last_seen_sequence]
          properties:
            command_type:
              const: session.reconcile.v1
            payload:
              type: object
              additionalProperties: false
              maxProperties: 0
    SessionStateEventEnvelopeV1:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - event_type
        - session_id
        - session_sequence
        - session_version
        - occurred_at
        - payload
      properties:
        schema_version:
          type: string
          const: v1
        event_type:
          type: string
          enum:
            - session.message.accepted.v1
            - session.agent.fragment.v1
            - session.state.changed.v1
            - session.terminal.v1
        session_id:
          $ref: '#/components/schemas/StableId'
        session_sequence:
          $ref: '#/components/schemas/PositiveInt64WireString'
        session_version:
          type: integer
          minimum: 0
          maximum: 2147483647
        occurred_at:
          $ref: '#/components/schemas/UtcTimestamp'
        correlation_id:
          $ref: '#/components/schemas/StableId'
        payload:
          type: object
          additionalProperties: false
          required: [summary]
          properties:
            summary:
              type: string
              minLength: 1
              maxLength: 512
            turn_id:
              $ref: '#/components/schemas/StableId'
    ResolvedExecutionManifestV1:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - manifest_id
        - ownership
        - configuration_ref
        - runtime_records
        - terminal_state
      properties:
        schema_version:
          type: string
          const: v1
        manifest_id:
          $ref: '#/components/schemas/StableId'
        ownership:
          $ref: '#/components/schemas/SessionOwnershipRefV1'
        configuration_ref:
          type: object
          additionalProperties: false
          required: [configuration_id, configuration_digest]
          properties:
            configuration_id:
              $ref: '#/components/schemas/StableId'
            configuration_digest:
              type: string
              pattern: '^[0-9a-f]{64}$'
        runtime_records:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/ManifestRuntimeRecordV1'
        terminal_state:
          type: string
          enum: [active, completing, completed, terminated, aborted]
        terminal_seal:
          $ref: '#/components/schemas/TerminalSealV1'
      allOf:
        - if:
            properties:
              terminal_state:
                enum: [completed, terminated, aborted]
            required: [terminal_state]
          then:
            required: [terminal_seal]
        - if:
            properties:
              terminal_state:
                enum: [active, completing]
            required: [terminal_state]
          then:
            properties:
              terminal_seal: false
    SessionOwnershipRefV1:
      type: object
      additionalProperties: false
      required:
        - organization_id
        - activity_id
        - participant_id
        - attempt_id
        - session_id
      properties:
        organization_id:
          $ref: '#/components/schemas/StableId'
        activity_id:
          $ref: '#/components/schemas/StableId'
        participant_id:
          $ref: '#/components/schemas/StableId'
        attempt_id:
          $ref: '#/components/schemas/StableId'
        session_id:
          $ref: '#/components/schemas/StableId'
    ManifestRuntimeRecordV1:
      type: object
      additionalProperties: false
      required:
        - sequence
        - record_type
        - service_actor
        - occurred_at
        - payload_ref
      properties:
        sequence:
          $ref: '#/components/schemas/PositiveInt64WireString'
        record_type:
          type: string
          enum:
            - model.invocation.v1
            - transcript.append.v1
            - timer.event.v1
        service_actor:
          type: string
          minLength: 1
          maxLength: 128
        occurred_at:
          $ref: '#/components/schemas/UtcTimestamp'
        payload_ref:
          type: object
          additionalProperties: false
          required: [protected_ref, content_digest]
          properties:
            protected_ref:
              $ref: '#/components/schemas/StableId'
            content_digest:
              type: string
              pattern: '^[0-9a-f]{64}$'
    TerminalSealV1:
      type: object
      additionalProperties: false
      required: [procedure_id, seal_digest]
      properties:
        procedure_id:
          type: string
          enum:
            - manifest-jcs-sha256-v1
            - manifest-jcs-sha256-v2
        seal_digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
    EvidenceLocatorV1:
      type: object
      additionalProperties: false
      required:
        - locator_schema
        - source_type
        - source_ref
        - ownership_ref
        - location
        - precision
        - integrity
        - created_by
      properties:
        locator_schema:
          type: string
          const: evidence-locator.v1
        source_type:
          type: string
          enum:
            - submission.direct_text
            - submission.text_attachment
            - session.transcript_item
            - session.work_trace
            - configuration.fact
            - manifest.fact
            - deterministic.fact
        source_ref:
          type: object
          additionalProperties: false
          required: [source_id, source_version]
          properties:
            source_id:
              $ref: '#/components/schemas/StableId'
            source_version:
              $ref: '#/components/schemas/StableId'
            terminal_cutoff_sequence:
              $ref: '#/components/schemas/PositiveInt64WireString'
        ownership_ref:
          type: object
          additionalProperties: false
          required:
            - organization_id
            - activity_id
            - participant_id
            - attempt_id
            - session_id
            - evaluation_id
          properties:
            organization_id:
              $ref: '#/components/schemas/StableId'
            activity_id:
              $ref: '#/components/schemas/StableId'
            participant_id:
              $ref: '#/components/schemas/StableId'
            attempt_id:
              $ref: '#/components/schemas/StableId'
            session_id:
              $ref: '#/components/schemas/StableId'
            evaluation_id:
              $ref: '#/components/schemas/StableId'
        location:
          oneOf:
            - $ref: '#/components/schemas/WholeItemLocationV1'
            - $ref: '#/components/schemas/LineRangeLocationV1'
            - $ref: '#/components/schemas/Utf8ByteRangeLocationV1'
            - $ref: '#/components/schemas/JsonPointerLocationV1'
        precision:
          type: string
          enum: [exact_range, stable_segment, whole_item]
        integrity:
          type: object
          additionalProperties: false
          required: [source_digest, adapter_version, verification_state]
          properties:
            source_digest:
              type: string
              pattern: '^[0-9a-f]{64}$'
            adapter_version:
              type: string
              minLength: 1
              maxLength: 64
            verification_state:
              type: string
              enum: [verified, degraded, failed]
        created_by:
          type: object
          additionalProperties: false
          required: [service_id, invocation_id]
          properties:
            service_id:
              type: string
              minLength: 1
              maxLength: 128
            invocation_id:
              $ref: '#/components/schemas/StableId'
      allOf:
        - if:
            properties:
              source_type:
                enum:
                  - submission.direct_text
                  - submission.text_attachment
            required: [source_type]
          then:
            properties:
              location:
                oneOf:
                  - $ref: '#/components/schemas/WholeItemLocationV1'
                  - $ref: '#/components/schemas/LineRangeLocationV1'
                  - $ref: '#/components/schemas/Utf8ByteRangeLocationV1'
              precision:
                enum: [exact_range, whole_item]
        - if:
            properties:
              source_type:
                enum:
                  - session.transcript_item
                  - session.work_trace
            required: [source_type]
          then:
            required: [source_ref]
            properties:
              source_ref:
                required: [terminal_cutoff_sequence]
              location:
                oneOf:
                  - $ref: '#/components/schemas/WholeItemLocationV1'
                  - $ref: '#/components/schemas/Utf8ByteRangeLocationV1'
              precision:
                enum: [exact_range, whole_item]
        - if:
            properties:
              source_type:
                enum:
                  - configuration.fact
                  - manifest.fact
                  - deterministic.fact
            required: [source_type]
          then:
            properties:
              location:
                $ref: '#/components/schemas/JsonPointerLocationV1'
              precision:
                enum: [exact_range, stable_segment, whole_item]
    WholeItemLocationV1:
      type: object
      additionalProperties: false
      required: [location_type, item_id]
      properties:
        location_type:
          const: whole_item
        item_id:
          $ref: '#/components/schemas/StableId'
    LineRangeLocationV1:
      type: object
      additionalProperties: false
      required: [location_type, item_id, start_line_inclusive, end_line_inclusive, line_split_procedure_version]
      properties:
        location_type:
          const: line_range
        item_id:
          $ref: '#/components/schemas/StableId'
        start_line_inclusive:
          type: integer
          minimum: 1
          maximum: 1048576
        end_line_inclusive:
          type: integer
          minimum: 1
          maximum: 1048576
        line_split_procedure_version:
          type: string
          minLength: 1
          maxLength: 64
    Utf8ByteRangeLocationV1:
      type: object
      additionalProperties: false
      required: [location_type, item_id, start_inclusive, end_exclusive, excerpt_digest]
      properties:
        location_type:
          const: utf8_byte_range
        item_id:
          $ref: '#/components/schemas/StableId'
        start_inclusive:
          type: integer
          minimum: 0
          maximum: 1048576
        end_exclusive:
          type: integer
          minimum: 1
          maximum: 1048577
        excerpt_digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
    JsonPointerLocationV1:
      type: object
      additionalProperties: false
      required: [location_type, json_pointer]
      properties:
        location_type:
          const: json_pointer
        json_pointer:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^/'
    AuditEventV1:
      type: object
      additionalProperties: false
      required:
        - event_schema
        - event_id
        - actor
        - organization_id
        - action
        - resource_ref
        - outcome
        - occurred_at
        - correlation_id
      properties:
        event_schema:
          type: string
          const: audit-event.v1
        event_id:
          $ref: '#/components/schemas/StableId'
        actor:
          type: object
          additionalProperties: false
          required: [actor_type, actor_id]
          properties:
            actor_type:
              type: string
              enum: [human, service, system]
            actor_id:
              type: string
              minLength: 1
              maxLength: 128
        organization_id:
          $ref: '#/components/schemas/StableId'
        action:
          type: string
          minLength: 1
          maxLength: 128
        resource_ref:
          type: object
          additionalProperties: false
          required: [resource_type, resource_id]
          properties:
            resource_type:
              type: string
              minLength: 1
              maxLength: 64
            resource_id:
              $ref: '#/components/schemas/StableId'
        outcome:
          type: string
          enum: [succeeded, denied, failed]
        reason_code:
          type: string
          minLength: 1
          maxLength: 64
        occurred_at:
          $ref: '#/components/schemas/UtcTimestamp'
        correlation_id:
          $ref: '#/components/schemas/StableId'
        durability_class:
          type: string
          enum: [required_durable, bufferable]
    SafeErrorResponseV1:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - outcome
        - correlation_id
        - permitted_recovery_action
      properties:
        schema_version:
          type: string
          const: v1
        outcome:
          type: string
          enum:
            - validation_failed
            - conflict
            - unauthorized
            - forbidden
            - not_found
            - rate_limited
            - unavailable
            - internal_error
        correlation_id:
          $ref: '#/components/schemas/StableId'
        permitted_recovery_action:
          type: string
          enum: [retry, reconcile, contact_administrator, none]
        session_version:
          type: integer
          minimum: 0
          maximum: 2147483647
        session_sequence:
          $ref: '#/components/schemas/NonnegativeInt64WireString'
    SseSessionEventV1:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - event_type
        - session_id
        - session_sequence
        - occurred_at
        - payload
      properties:
        schema_version:
          type: string
          const: v1
        event_type:
          type: string
          enum:
            - session.agent.fragment.v1
            - session.agent.complete.v1
            - session.agent.work.v1
            - session.state.changed.v1
            - session.terminal.v1
        session_id:
          $ref: '#/components/schemas/StableId'
        session_sequence:
          $ref: '#/components/schemas/PositiveInt64WireString'
        occurred_at:
          $ref: '#/components/schemas/UtcTimestamp'
        payload:
          type: object
          additionalProperties: false
          required: [summary]
          properties:
            summary:
              type: string
              minLength: 1
              maxLength: 512
            fragment_sequence:
              type: integer
              minimum: 1
              maximum: 65535
            agent_message_id:
              $ref: '#/components/schemas/StableId'
            text_delta:
              type: string
              maxLength: 4096
            turn_id:
              $ref: '#/components/schemas/StableId'
            work_state:
              type: string
              enum:
                - queued
                - working
                - resolved
            resolution_category:
              type: string
              enum:
                - message_stream
                - no_action
                - suppressed_failure
                - execution_failure
            show_persistent_turn_status:
              type: boolean
            assembled_content_digest:
              type: string
              pattern: '^[0-9a-f]{64}$'
            fragment_count:
              type: integer
              minimum: 1
              maximum: 65535
