title = "flex-agent"

[extend]
useDefault = true

# Extend the default generic-api-key rule with a narrow allowlist: only synthetic
# idempotency_key fixture values under contracts/fixtures/.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Documented synthetic idempotency_key values in JSON schema fixtures."
condition = "AND"
paths = ['''(?i)contracts/fixtures/''']
regexes = ['''(?i)^(idem-synthetic|enr-assign-synthetic|enr-suspend-synthetic|acc-grant-synthetic|acc-decide-synthetic|acc-revoke-synthetic|intake-begin-synthetic|intake-complete-synthetic|intake-finalize-synthetic|attempt-ack-synthetic|attempt-start-synthetic)-\d{4}$''']

[[rules.allowlists]]
description = "Documented quotes of the same synthetic idempotency_key values in implementation task records."
condition = "AND"
paths = ['''(?i)\.work/active/''']
regexes = ['''(?i)^(idem-synthetic|enr-assign-synthetic|enr-suspend-synthetic|acc-grant-synthetic|acc-decide-synthetic|acc-revoke-synthetic|intake-begin-synthetic|intake-complete-synthetic|intake-finalize-synthetic|attempt-ack-synthetic|attempt-start-synthetic)-\d{4}$''']

[[rules.allowlists]]
description = "Documented Attempt start synthetic idempotency keys in tests."
condition = "AND"
paths = [
  '''(?i)tests/Runtime/FlexAgent\.Runtime\.Tests/AttemptHttpNegativeContractTests\.cs$''',
  '''(?i)tests/Runtime/FlexAgent\.Runtime\.Tests/SubmissionRequestValidatorTests\.cs$''',
  '''(?i)tests/Integration/FlexAgent\.Postgres\.Integration\.Tests/AttemptStartPersistenceTests\.cs$''',
  '''(?i)tests/Contract/FlexAgent\.Contract\.Tests/ContractMappingParityTests\.cs$''',
]
regexes = ['''(?i)^(idempotency_key":")?(attempt-ack-synthetic|attempt-start-synthetic)-\d{4}"?$''']

[[rules.allowlists]]
description = "Repeated-letter synthetic trusted_command_digest fixtures in Attempt HTTP negatives."
condition = "AND"
paths = [
  '''(?i)tests/Runtime/FlexAgent\.Runtime\.Tests/AttemptHttpNegativeContractTests\.cs$''',
]
regexes = ['''^[aA]{64}$''']

[[rules.allowlists]]
description = "Synthetic Submission HTTP negative-test idempotency keys."
condition = "AND"
paths = ['''(?i)tests/Runtime/FlexAgent.Runtime.Tests/SubmissionHttpNegativeContractTests.cs''']
regexes = ['''(?i)^(sub-1|sub-cancel-1|sub-finalize-1|intake-http-synthetic-\d{4})$''']

[[rules.allowlists]]
description = "Synthetic browser command idempotency keys in Query auth-lifecycle tests."
condition = "AND"
paths = ['''(?i)web(-legacy)?/src/api/query-client\.test\.tsx$''']
regexes = ['''(?i)^cmd-(1|denied-refresh|401|stale-401)$''']

[[rules.allowlists]]
description = "Quoted synthetic Query-test idempotency keys in implementation task records."
condition = "AND"
paths = ['''(?i)\.work/active/''']
regexes = ['''(?i)^cmd-(1|denied-refresh|401|stale-401)$''']

[[rules.allowlists]]
description = "SHA-256 content hashes of copied design-lab stylesheets."
condition = "AND"
paths = ['''(?i)web/src/design-lab/copied-styles\.test\.ts$''']
regexes = ['''^[a-f0-9]{64}$''']

[[rules.allowlists]]
description = "Synthetic Keycloak JDBC URLs in local/CI compose profiles."
condition = "AND"
paths = [
  '''(?i)deploy/compose/authenticated-browser\.compose\.yaml$''',
  '''(?i)deploy/compose/keycloak-contract\.compose\.yaml$''',
]
regexes = ['''5432/keycloak''']

[[rules.allowlists]]
description = "Synthetic JWT fragments in human-authentication tests."
condition = "AND"
paths = [
  '''(?i)tests/Integration/FlexAgent\.Postgres\.Integration\.Tests/HumanAuthenticationPersistenceTests\.cs$''',
  '''(?i)tests/Runtime/FlexAgent\.Runtime\.Tests/HumanAuthenticationEndSessionTests\.cs$''',
  '''(?i)tests/Runtime/FlexAgent\.Runtime\.Tests/HumanAuthenticationCoordinatorTests\.cs$''',
]
regexes = ['''eyJ''']

[[rules.allowlists]]
description = "Synthetic session command idempotency keys in envelope validator tests."
condition = "AND"
paths = [
  '''(?i)tests/Sessions/FlexAgent\.Sessions\.Tests/Application/HostedSessionCommandEnvelopeValidatorTests\.cs$''',
]
regexes = ['''(?i)^(idempotency_key":")?(idem-synthetic)-\d{4}"?$''']
