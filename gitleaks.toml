title = "flex-agent"

[extend]
useDefault = true

# Extend the default generic-api-key rule with a narrow allowlist: only synthetic
# idempotency_key fixture values under contracts/fixtures/.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Documented synthetic idempotency_key values in JSON schema fixtures."
condition = "AND"
paths = ['''(?i)contracts/fixtures/''']
regexes = ['''(?i)^idem-synthetic-\d{4}$''']

[[rules.allowlists]]
description = "Synthetic Keycloak JDBC URLs in local/CI compose profiles."
condition = "AND"
paths = ['''(?i)deploy/compose/(keycloak-contract|authenticated-browser)\.compose\.yaml$''']
regexes = ['''5432/keycloak''']
