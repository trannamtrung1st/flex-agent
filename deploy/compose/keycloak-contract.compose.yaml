# Local/CI Keycloak 26.7.0 contract profile for Flex Agent human authentication.
# Synthetic data only. Do not use real Participant credentials or production secrets.
name: flex-agent-keycloak-contract

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: flexagent
      POSTGRES_PASSWORD: flexagent_test_password
      POSTGRES_DB: flexagent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flexagent -d flexagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak-db:
    image: postgres:18
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_test_password
      POSTGRES_DB: keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command:
      - start-dev
      - --import-realm
      - --hostname=localhost
      - --http-enabled=true
      - --proxy-headers=xforwarded
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_test_password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./keycloak/flex-agent-realm.json:/opt/keycloak/data/import/flex-agent-realm.json:ro
    ports:
      - "18081:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy

  nginx:
    image: nginx:1.30.4
    volumes:
      - ./nginx/keycloak-contract.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "18080:80"
    depends_on:
      - keycloak
