# Development/Testing demo-work list fixtures. Synthetic data only.
name: flex-agent-authenticated-browser

services:
  postgres:
    volumes:
      - ./authenticated-browser/seed-demo-work.sql:/seed/seed-demo-work.sql:ro

  seed-demo-work:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      PGPASSWORD: flexagent_test_password
    volumes:
      - ./authenticated-browser/seed-demo-work.sql:/seed/seed-demo-work.sql:ro
    command:
      [
        "psql",
        "-h",
        "postgres",
        "-U",
        "flexagent",
        "-d",
        "flexagent",
        "-v",
        "ON_ERROR_STOP=1",
        "-f",
        "/seed/seed-demo-work.sql",
      ]
    depends_on:
      seed:
        condition: service_completed_successfully

  api:
    depends_on:
      seed-demo-work:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
