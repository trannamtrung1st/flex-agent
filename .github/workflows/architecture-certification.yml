name: Architecture certification

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: architecture-certification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oci-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18.0"

      - run: corepack enable

      - name: Prepare web lockfile context
        run: pnpm install --frozen-lockfile

      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0

      - name: Build API image (linux/arm64)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          platforms: linux/arm64
          push: false
          tags: flex-agent-api:linux-arm64

      - name: Build worker image (linux/arm64)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: deploy/docker/worker.Dockerfile
          platforms: linux/arm64
          push: false
          tags: flex-agent-worker:linux-arm64

      - name: Build SPA image (linux/arm64)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: deploy/docker/spa.Dockerfile
          platforms: linux/arm64
          push: false
          tags: flex-agent-spa:linux-arm64
