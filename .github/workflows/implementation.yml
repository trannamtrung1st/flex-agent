name: Implementation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: implementation-${{ github.workflow }}-${{ github.ref }}
  # PRs may cancel superseded runs. Push to main must not: a later docs-only
  # commit would cancel an implementation SHA and then skip every gate.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      implementation: ${{ steps.detect.outputs.implementation }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        # Push to main always runs full gates. PRs keep path-based skipping.
        run: bash build/scripts/detect-implementation-changes.sh

  dotnet:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.implementation == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.1.0
        with:
          dotnet-version: |
            10.0.100
            10.0.x

      - name: Verify .NET workspace
        run: bash build/scripts/verify-dotnet.sh

  web:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.implementation == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18.0"

      - name: Enable Corepack
        run: corepack enable

      - name: Verify web workspace
        run: bash build/scripts/verify-web.sh

  supply-chain:
    runs-on: ubuntu-latest
    needs: [changes, dotnet, web]
    if: needs.changes.outputs.implementation == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.1.0
        with:
          dotnet-version: |
            10.0.100
            10.0.x

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18.0"

      - run: corepack enable

      - name: Restore dependencies
        run: |
          dotnet restore FlexAgent.slnx --locked-mode
          pnpm install --frozen-lockfile

      - name: Publish shipped artifacts
        run: |
          mkdir -p artifacts/publish/api artifacts/publish/worker
          dotnet publish src/Hosts/FlexAgent.Api/FlexAgent.Api.csproj -c Release -o artifacts/publish/api /p:UseAppHost=false
          dotnet publish src/Hosts/FlexAgent.Worker/FlexAgent.Worker.csproj -c Release -o artifacts/publish/worker /p:UseAppHost=false
          pnpm build

      - name: NuGet vulnerability scan
        run: |
          dotnet list FlexAgent.slnx package --vulnerable --include-transitive | tee artifacts-nuget-vuln.txt
          if grep -q "has the following vulnerable packages" artifacts-nuget-vuln.txt; then
            exit 1
          fi

      - name: pnpm audit
        run: pnpm audit --audit-level=high

      - name: License inventory
        run: |
          mkdir -p artifacts/supply-chain
          bash build/scripts/generate-nuget-licenses.sh artifacts/supply-chain/nuget-licenses.json
          pnpm licenses list --json > artifacts/supply-chain/npm-licenses.json || pnpm licenses ls --json > artifacts/supply-chain/npm-licenses.json

      - name: Install verified supply-chain tools
        run: |
          echo "${RUNNER_TEMP}/supply-chain/bin" >> "$GITHUB_PATH"
          INSTALL_DIR="${RUNNER_TEMP}/supply-chain/bin" bash build/scripts/ensure-supply-chain-tools.sh

      - name: Generate SBOM
        run: |
          syft dir:artifacts/publish -o cyclonedx-json > artifacts/supply-chain/sbom-publish.cdx.json
          bash build/scripts/generate-spa-sbom.sh artifacts/supply-chain/sbom-spa.cdx.json

      - name: Scan SBOM for vulnerabilities
        run: |
          grype sbom:artifacts/supply-chain/sbom-publish.cdx.json --fail-on high
          grype sbom:artifacts/supply-chain/sbom-spa.cdx.json --fail-on high

      - name: Secret scan
        run: gitleaks detect --source . --config gitleaks.toml --no-banner --redact

      - name: Build OCI images for SBOM scan
        run: bash build/scripts/build-oci-images.sh

      - name: Scan OCI image SBOMs
        run: INSTALL_DIR="${RUNNER_TEMP}/supply-chain/bin" bash build/scripts/scan-oci-image-sboms.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-evidence
          path: artifacts/supply-chain/

  oci:
    name: oci-oidc-smoke
    runs-on: ubuntu-latest
    needs: [changes, dotnet, web]
    if: needs.changes.outputs.implementation == 'true'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18.0"

      - run: corepack enable

      - name: Prepare web lockfile context
        run: pnpm install --frozen-lockfile

      - uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0
        with:
          driver: docker

      - name: Build API image (linux/amd64)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          push: false
          load: true
          provenance: false
          sbom: false
          tags: flex-agent-api:linux-amd64

      - name: Build worker image (linux/amd64)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: deploy/docker/worker.Dockerfile
          push: false
          load: true
          provenance: false
          sbom: false
          tags: flex-agent-worker:linux-amd64

      - name: Build SPA image (linux/amd64)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: deploy/docker/spa.Dockerfile
          push: false
          load: true
          provenance: false
          sbom: false
          tags: flex-agent-spa:linux-amd64
          build-args: |
            VITE_API_MODE=production

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: OIDC live smoke
        env:
          FLEXAGENT_COMPOSE_PROJECT: flex-agent-oidc-${{ github.run_id }}
          FLEXAGENT_OIDC_API_IMAGE: flex-agent-oidc-api:ci
          FLEXAGENT_OIDC_SPA_IMAGE: flex-agent-oidc-spa:ci
          FLEXAGENT_OIDC_SKIP_STATIC: "1"
          FLEXAGENT_SEED_DEMO_WORK: "0"
          COMPOSE_HTTP_TIMEOUT: "300"
          DOCKER_CLIENT_TIMEOUT: "300"
        run: |
          for image in flex-agent-api:linux-amd64 flex-agent-spa:linux-amd64; do
            if ! docker image inspect "${image}" >/dev/null 2>&1; then
              echo "::error::OIDC smoke requires ${image} in the local Docker daemon (set load: true on build-push-action)"
              exit 1
            fi
            arch="$(docker image inspect "${image}" --format '{{.Os}}/{{.Architecture}}')"
            if [[ "${arch}" != "linux/amd64" ]]; then
              echo "::error::${image} is ${arch}, expected linux/amd64"
              exit 1
            fi
            if ! docker run --rm --entrypoint /bin/true "${image}"; then
              echo "::error::${image} is present but not runnable in the Docker daemon"
              exit 1
            fi
          done
          docker tag flex-agent-api:linux-amd64 flex-agent-oidc-api:ci
          docker tag flex-agent-spa:linux-amd64 flex-agent-oidc-spa:ci
          bash build/scripts/verify-oidc-ci.sh

      - name: Tear down OIDC Compose
        if: always()
        env:
          FLEXAGENT_COMPOSE_PROJECT: flex-agent-oidc-${{ github.run_id }}
        run: bash build/scripts/authenticated-browser-profile.sh --project-name "${FLEXAGENT_COMPOSE_PROJECT}" down || true

  oidc:
    name: oidc
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.implementation == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Verify OIDC static gate
        env:
          FLEXAGENT_OIDC_SKIP_LIVE: "1"
        run: bash build/scripts/verify-oidc-ci.sh
